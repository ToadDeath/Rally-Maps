<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Canyon Notes - US-34 Rally Map</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101820;--panel:rgba(16,26,35,.96);--line:rgba(255,255,255,.13);--muted:#9aabb9;--text:#f4f7fa;--gold:#f2b84b}
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}#map{position:absolute;inset:0}
.top{position:absolute;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}.brand,.status{pointer-events:auto;background:rgba(13,21,29,.94);border:1px solid var(--line);border-radius:15px;padding:10px 12px;box-shadow:0 8px 28px #0005;backdrop-filter:blur(12px)}.eyebrow{font-size:9px;letter-spacing:.15em;color:var(--gold);font-weight:900}.brand b{display:block;font-size:14px;margin-top:2px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.status{font-size:10px;font-weight:800;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:#43c58a;border-radius:50%;margin-right:6px}
.actions{position:absolute;z-index:3;right:12px;top:94px;display:flex;flex-direction:column;gap:8px}button{font:inherit;color:var(--text);background:rgba(15,24,32,.95);border:1px solid var(--line);border-radius:12px;min-height:43px;min-width:43px;padding:0 12px;font-size:11px;font-weight:800;box-shadow:0 5px 18px #0004;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.97)}.actions .zoom{font-size:19px;padding:0}
.sheet{position:absolute;z-index:4;left:9px;right:9px;bottom:max(9px,env(safe-area-inset-bottom));max-height:min(43vh,360px);display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:21px;box-shadow:0 15px 45px #0007;backdrop-filter:blur(17px)}.handle{width:36px;height:4px;background:#52616d;border-radius:9px;margin:9px auto 1px}.sheethead{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;gap:10px}.sheethead b{font-size:12px;letter-spacing:.04em}.sub{font-size:10px;color:var(--muted);margin-top:3px}.pill{font-size:9px;color:#f6d28b;background:#f2b84b1c;border:1px solid #f2b84b44;border-radius:20px;padding:6px 8px;white-space:nowrap;font-weight:900}.tools{display:flex;gap:7px;padding:0 12px 9px}.tools button{flex:1;min-height:34px;font-size:10px;padding:0 6px;box-shadow:none}.tools button.active{background:#263b4b;border-color:#64a9ff88;color:#d5eaff}.notes{overflow:auto;padding:0 9px 9px;overscroll-behavior:contain}.note{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:9px;text-align:left;border:0;border-top:1px solid #ffffff10;border-radius:0;box-shadow:none;background:transparent;padding:9px 7px;min-height:51px}.note.selected{background:#64a9ff1c;border-radius:10px}.num{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;color:#101820;font-size:13px;font-weight:950}.label{font-size:11px;font-weight:900}.detail{font-size:9px;color:var(--muted);margin-top:3px}.dist{font-size:10px;color:#d0dae2;white-space:nowrap;font-variant-numeric:tabular-nums}.empty{padding:12px;color:var(--muted);font-size:11px;line-height:1.5}.pin{width:31px;height:34px;border:2px solid white;border-radius:50% 50% 50% 3px;transform:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px #0008;color:#101820;font-size:12px;font-weight:950;font-style:normal}.pin span{transform:none;font-style:normal;display:block;line-height:1}.sev1,.sev2{background:#f06b62}.sev3,.sev4{background:#f2b84b}.sev5,.sev6{background:#62c9a0}.maplibregl-popup-content{background:#14212b;color:#f4f7fa;border:1px solid var(--line);border-radius:11px;padding:10px 12px}.maplibregl-popup-tip{border-top-color:#14212b!important;border-bottom-color:#14212b!important}.pop-title{font-weight:900;font-size:12px}.pop-sub{font-size:10px;color:#a8b7c3;margin-top:4px}
@media(min-width:760px){.top{top:18px;left:20px;right:20px}.actions{right:20px;top:105px}.sheet{left:20px;bottom:20px;width:350px;max-height:65vh}}
</style>
</head>
<body>
<div id="map" aria-label="Interactive US-34 canyon map"></div>
<header class="top"><div class="brand"><div class="eyebrow">CANYON NOTES · STAGE 001</div><b>BIG THOMPSON CANYON</b><small>KING'S CORNER CIRCLE K → ESTES PARK ELEMENTARY</small></div><div class="status"><span class="dot"></span><span id="status">LOADING</span></div></header>
<div class="actions"><button class="zoom" id="plus" aria-label="Zoom in">+</button><button class="zoom" id="minus" aria-label="Zoom out">−</button><button id="locate">◎ Locate</button><button id="fit">Fit route</button></div>
<section class="sheet"><div class="handle"></div><div class="sheethead"><div><b>ROADBOOK <span id="count">· loading</span></b><div class="sub" id="summary">Fetching US-34 road geometry…</div></div><div class="pill">AUTO NOTES · PREVIEW</div></div><div class="tools"><button class="active" id="markers">Corner markers: ON</button><button class="active" id="line">Route line: ON</button><button id="direction">Direction: Loveland → Estes</button></div><div class="notes" id="notes"><div class="empty">Loading the canyon road. Notes are experimental geometry estimates, not verified driving instructions.</div></div></section>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
const A=[-105.0727291,40.3787827],B=[-105.4975,40.3685]; // Circle K #2740698, 1040 S Lincoln Ave, to Estes Park Elementary School.
const CANYON_START=[-105.2268,40.42183]; // Callouts begin by The Dam Store, not at the route start.
const CANYON_END=[-105.5000,40.3750]; // Approximate east-side canyon exit; callouts stop before the route continues into Estes Park.
const map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/dark",center:[-105.31,40.39],zoom:10.2,attributionControl:true});
map.addControl(new maplibregl.NavigationControl({showCompass:true}),"bottom-right");
let coords=[],stageCoords=[],corners=[],pins=[],showPins=true,showLine=true,bounds=null,selected=0,direction="forward";
const $=id=>document.getElementById(id),status=$("status");
function dist(a,b){let r=Math.PI/180,p=a[1]*r,q=b[1]*r,dp=(b[1]-a[1])*r,dl=(b[0]-a[0])*r,h=Math.sin(dp/2)**2+Math.cos(p)*Math.cos(q)*Math.sin(dl/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function bearing(a,b){let r=Math.PI/180,p=a[1]*r,q=b[1]*r,l=(b[0]-a[0])*r;return(Math.atan2(Math.sin(l)*Math.cos(q),Math.cos(p)*Math.sin(q)-Math.sin(p)*Math.cos(q)*Math.cos(l))*180/Math.PI+360)%360}
function angle(a){return((a+540)%360)-180}
function at(points,cum,d){let lo=0,hi=cum.length-1;while(lo<hi){let m=(lo+hi)>>1;if(cum[m]<d)lo=m+1;else hi=m}let i=Math.max(1,lo),t=(d-cum[i-1])/(cum[i]-cum[i-1]||1);return[points[i-1][0]+(points[i][0]-points[i-1][0])*t,points[i-1][1]+(points[i][1]-points[i-1][1])*t]}
function fmt(m){return m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1)+" km"}
function noteDistance(m){
  if(m==null||m<40)return "";
  let n=Math.round(m/10)*10;
  if(n<100)n=Math.max(40,Math.round(n/20)*20);
  else if(n%20===0)n+=m>=n?10:-10;
  return n+" m";
}
function severity(radius){
  return radius<32?1:radius<55?2:radius<85?3:radius<130?4:radius<200?5:6;
}
function detect(points){
  const step=5,cum=[0];
  for(let i=1;i<points.length;i++)cum.push(cum[i-1]+dist(points[i-1],points[i]));
  const total=cum.at(-1),samples=[];
  for(let d=0;d<=total;d+=step){
    const p=at(points,cum,d),before=at(points,cum,Math.max(0,d-25)),after=at(points,cum,Math.min(total,d+25));
    const delta=angle(bearing(p,after)-bearing(before,p));
    samples.push({d,delta,rate:Math.abs(delta)/Math.max(1,Math.min(total,d+25)-Math.max(0,d-25))});
  }
  const threshold=0.075,active=samples.map(x=>x.rate>=threshold);
  // Bridge brief geometry noise, but keep distinct opposite-direction corners separate.
  for(let i=1;i<active.length-1;i++){
    if(!active[i]&&active[i-1]&&active[i+1]&&Math.sign(samples[i-1].delta)===Math.sign(samples[i+1].delta))active[i]=true;
  }
  const runs=[];let run=null;
  for(let i=0;i<samples.length;i++){
    const sign=Math.sign(samples[i].delta);
    if(active[i]&&sign){
      if(!run||run.sign!==sign||samples[i].d-run.lastD>25){
        if(run)runs.push(run);
        run={sign,start:samples[i].d,end:samples[i].d,lastD:samples[i].d};
      }else{run.end=samples[i].d;run.lastD=samples[i].d}
    }else if(run&&samples[i].d-run.lastD>25){runs.push(run);run=null}
  }
  if(run)runs.push(run);
  const candidates=[];
  for(const r of runs){
    const start=Math.max(0,r.start-15),end=Math.min(total,r.end+15),length=end-start;
    if(length<25)continue;
    const before=at(points,cum,Math.max(0,start-20)),after=at(points,cum,Math.min(total,end+20));
    const middle=at(points,cum,(start+end)/2);
    const turn=angle(bearing(middle,after)-bearing(before,middle));
    if(Math.abs(turn)<12||Math.sign(turn)!==r.sign)continue;
    const radius=length/(Math.abs(turn)*Math.PI/180);
    candidates.push({start,end,length,turn,radius,coordinate:at(points,cum,(start+end)/2),direction:turn>0?"RIGHT":"LEFT"});
  }
  // Merge adjacent same-direction fragments caused by small changes in curvature.
  const merged=[];
  for(const c of candidates){
    const p=merged.at(-1);
    if(p&&p.direction===c.direction&&c.start-p.end<45){
      p.end=c.end;p.length=p.end-p.start;
      const before=at(points,cum,Math.max(0,p.start-20)),after=at(points,cum,Math.min(total,p.end+20)),mid=at(points,cum,(p.start+p.end)/2);
      p.turn=angle(bearing(mid,after)-bearing(before,mid));
      p.radius=p.length/(Math.max(1,Math.abs(p.turn))*Math.PI/180);
      p.coordinate=mid;
    }else merged.push({...c});
  }
  const corners=merged.map((c,i)=>({...c,id:i+1,severity:severity(c.radius)}));
  corners.forEach((c,i)=>{
    const next=corners[i+1];
    c.gapAfter=next?Math.max(0,next.start-c.end):null;
    c.next=next||null;
    c.conjunction=next?(c.gapAfter<20||next.severity<c.severity?"INTO":"AND"):null;
  });
  return corners;
}
function nearestRouteIndex(target){let best=Infinity,index=0;coords.forEach((p,i)=>{let d=dist(p,target);if(d<best){best=d;index=i}});return{index,distance:best}}
function routeLength(points){let n=0;for(let i=1;i<points.length;i++)n+=dist(points[i-1],points[i]);return n}
function applyDirection(){let points=direction==="forward"?stageCoords:[...stageCoords].reverse();corners=detect(points);selected=0;renderPins();renderNotes();$("direction").textContent="Direction: "+(direction==="forward"?"Loveland → Estes":"Estes → Loveland");$("summary").textContent=fmt(routeLength(points))+" canyon section · "+(direction==="forward"?"east to west":"west to east")}
function renderPins(){pins.forEach(p=>p.remove());pins=[];if(!showPins)return;corners.forEach(c=>{let el=document.createElement("div");el.className="pin sev"+c.severity;el.innerHTML="<span>"+c.severity+"</span>";el.title=c.direction+" "+c.severity;el.addEventListener("click",()=>select(c.id,true));pins.push(new maplibregl.Marker({element:el}).setLngLat(c.coordinate).addTo(map))})}
function renderNotes(){
  $("count").textContent="· "+corners.length+" corners";
  $("notes").innerHTML=corners.map(c=>{
    const nextCall=c.next?(c.conjunction+" "+c.next.severity+" "+c.next.direction):"END OF NOTES";
    const distance=noteDistance(c.gapAfter);
    return '<button class="note '+(selected===c.id?"selected":"")+'" data-id="'+c.id+'"><span class="num" style="background:'+(c.severity<=2?"#f06b62":c.severity<=4?"#f2b84b":"#62c9a0")+'">'+c.severity+'</span><span><span class="label">'+c.severity+" "+c.direction+'</span><div class="detail">'+nextCall+'</div></span><span class="dist">'+distance+'</span></button>';
  }).join("");
  $("notes").querySelectorAll(".note").forEach(el=>el.onclick=()=>select(+el.dataset.id,true));
}
function select(id,fly){
  selected=id;let c=corners.find(x=>x.id===id);renderNotes();
  if(fly&&c){
    map.flyTo({center:c.coordinate,zoom:Math.max(13,map.getZoom()),speed:.9});
    const next=c.next?c.conjunction+" "+c.next.severity+" "+c.next.direction:"End of notes";
    const gap=c.gapAfter==null?"":noteDistance(c.gapAfter)+" to next corner";
    new maplibregl.Popup({offset:17}).setLngLat(c.coordinate).setHTML('<div class="pop-title">'+c.severity+" "+c.direction+'</div><div class="pop-sub">'+next+(gap?" · "+gap:"")+'<br>Estimated from road geometry only.</div>').addTo(map)
  }
}
function fit(){if(bounds)map.fitBounds(bounds,{padding:{top:105,bottom:250,left:30,right:30},duration:650})}
async function load(){try{status.textContent="LOADING ROUTE";let url="https://router.project-osrm.org/route/v1/driving/"+A.join(",")+";"+B.join(",")+"?overview=full&geometries=geojson";let res=await fetch(url);if(!res.ok)throw Error("Routing service returned "+res.status);let data=await res.json();if(data.code!=="Ok"||!data.routes?.length)throw Error("No route returned");coords=data.routes[0].geometry.coordinates;let feature={type:"Feature",properties:{name:"US-34 Big Thompson Canyon"},geometry:{type:"LineString",coordinates:coords}};map.addSource("route",{type:"geojson",data:feature});map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#08121b","line-width":["interpolate",["linear"],["zoom"],8,7,14,12]}});map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#f2b84b","line-width":["interpolate",["linear"],["zoom"],8,3,14,6]}});bounds=new maplibregl.LngLatBounds(coords[0],coords[0]);coords.forEach(p=>bounds.extend(p));let start=nearestRouteIndex(CANYON_START),finish=nearestRouteIndex(CANYON_END);if(start.distance>1200)throw Error("Dam Store boundary did not snap close to the current route ("+Math.round(start.distance)+" m away).");if(finish.distance>1800)throw Error("Canyon exit boundary did not snap close to the current route ("+Math.round(finish.distance)+" m away).");if(finish.index<=start.index)throw Error("Canyon boundaries are out of order on the route.");stageCoords=coords.slice(start.index,finish.index+1);if(stageCoords.length<10)throw Error("Canyon section is too short to analyze.");applyDirection();status.textContent="ROUTE READY";fit();}catch(e){console.error(e);status.textContent="ROUTE UNAVAILABLE";$("summary").textContent="Could not retrieve route";$("notes").innerHTML='<div class="empty">Could not load route geometry. Refresh when connected.<br>'+e.message+'</div>'}}
map.on("load",load);$("plus").onclick=()=>map.zoomIn();$("minus").onclick=()=>map.zoomOut();$("fit").onclick=fit;
$("locate").onclick=()=>{if(!navigator.geolocation){status.textContent='LOCATION UNAVAILABLE';return}navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:14}),()=>{status.textContent='LOCATION PERMISSION DENIED'},{enableHighAccuracy:true,timeout:10000})};
$("direction").onclick=()=>{direction=direction==="forward"?"reverse":"forward";applyDirection()};
$("markers").onclick=e=>{showPins=!showPins;e.currentTarget.textContent="Corner markers: "+(showPins?"ON":"OFF");e.currentTarget.classList.toggle("active",showPins);renderPins()};
$("line").onclick=e=>{showLine=!showLine;e.currentTarget.textContent="Route line: "+(showLine?"ON":"OFF");e.currentTarget.classList.toggle("active",showLine);["route-line","route-casing"].forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,"visibility",showLine?"visible":"none")})};
</script>
</body>
</html>
